<h2 mat-dialog-title>{{ data.Name }}</h2>
<mat-dialog-content>
  <p class="dialog-meta" *ngIf="data.BirthDate">
    Born {{ data.BirthDate | date : "longDate" }}<ng-container *ngIf="data.DeathDate">
      &middot; Died {{ data.DeathDate | date : "longDate" }}</ng-container>
  </p>
  <p>{{ data.Bio }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
