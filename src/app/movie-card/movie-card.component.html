<app-navigation-bar></app-navigation-bar>
<main class="page">
  <h1 class="page-title">Movies</h1>
  <p class="page-sub">
    Browse the collection, dig into a director or genre, and heart the ones you
    love.
  </p>

  <div class="status" *ngIf="loading">
    <mat-spinner diameter="36"></mat-spinner>
    <p>Loading movies&hellip; the server may take a few seconds to wake up.</p>
  </div>

  <div class="status" *ngIf="loadFailed">
    <p>We couldn't load the movies. Your session may have expired.</p>
    <a mat-stroked-button routerLink="/welcome">Back to log in</a>
  </div>

  <div class="movie-grid">
    <mat-card *ngFor="let movie of movies" class="movie-card">
      <img class="movie-poster" [src]="movie.ImageURL" [alt]="movie.Title" loading="lazy" />
      <div class="movie-info">
        <h3 class="movie-title">{{ movie.Title }}</h3>
        <p class="movie-director">Directed by {{ movie.Director.Name }}</p>
      </div>
      <div class="movie-actions">
        <button mat-button (click)="openGenreDialog(movie.Genre.Name, movie.Genre.Description)">
          Genre
        </button>
        <button mat-button (click)="openDirectorDialog(movie.Director.Name, movie.Director.Bio, movie.Director.BirthDate, movie.Director.DeathDate)">
          Director
        </button>
        <button mat-button (click)="openSynopsisDialog(movie.Title, movie.Description)">
          Synopsis
        </button>
        <span class="spacer"></span>
        <button
          mat-icon-button
          (click)="toggleFav(movie)"
          [matTooltip]="isFav(movie) ? 'Remove from favorites' : 'Add to favorites'"
          [attr.aria-label]="isFav(movie) ? 'Remove from favorites' : 'Add to favorites'"
        >
          <mat-icon [class.fav]="isFav(movie)">{{ isFav(movie) ? "favorite" : "favorite_border" }}</mat-icon>
        </button>
      </div>
    </mat-card>
  </div>
</main>
